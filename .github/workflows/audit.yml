name: Audit statique

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configurer Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vérifier la page
        run: node audit.mjs
      - name: Intégrer V5.7 si nécessaire
        if: github.event_name == 'push'
        run: python .github/scripts/integrate_sidebar_mark.py
      - name: Vérifier les assets V5.7
        if: github.event_name == 'push'
        run: |
          grep -q 'V5.7 — MARK WATTEAU SIDEBAR' index.html
          grep -q 'logo-watteau-mark-80.svg' index.html
          grep -q 'logo-watteau-mark-64.svg' index.html
          grep -q 'logo-watteau-mark-48.svg' index.html
      - name: Commit V5.7 si nécessaire
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V5.7 : intègre le mark Watteau responsive dans la sidebar'
          git push
