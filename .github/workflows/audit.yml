name: Audit statique

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
      - name: Configurer Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vérifier la page
        run: node audit.mjs
