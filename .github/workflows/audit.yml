name: Audit statique

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configurer Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vérifier la page
        run: node audit.mjs
      - name: Intégrer V6.1 si nécessaire
        if: github.event_name == 'push'
        run: python .github/scripts/v61_step1_novice.py
      - name: Vérifier V6.1
        if: github.event_name == 'push'
        run: |
          grep -q 'V6.1 — STEP 1 NOVICE GUIDANCE' index.html
          grep -q 'Prêt : tu peux terminer cette étape' index.html
          grep -q 'La question reste facultative' index.html
      - name: Commit V6.1 si nécessaire
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V6.1 : rend l’étape 1 autonome pour un élève novice'
          git push
