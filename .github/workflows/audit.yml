name: Audit statique

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configurer Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vérifier la page
        run: node audit.mjs
      - name: Intégrer le mark Watteau dans la sidebar
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'V5.7 — MARK WATTEAU SIDEBAR'
          if marker not in text:
              css = r'''

/* =========================================================
   V5.7 — MARK WATTEAU SIDEBAR
   Source institutionnelle inchangée, tailles adaptées au viewport.
   ========================================================= */
.sidebar-brand-mark{
  position:relative;
  z-index:4;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:-2px 3px 9px;
  padding:5px 4px 9px;
  border-bottom:1px solid rgba(255,212,59,.34);
}
.sidebar-brand-mark picture{display:block;line-height:0}
.sidebar-brand-mark img{
  display:block;
  width:80px;
  height:60px;
  object-fit:contain;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.28));
}
html[data-theme="light"] .sidebar-brand-mark{border-bottom-color:rgba(139,23,48,.18)}
html[data-theme="light"] .sidebar-brand-mark img{filter:drop-shadow(0 2px 5px rgba(66,43,14,.14))}
@media(max-width:820px){
  .sidebar-brand-mark{justify-content:flex-start;margin:0 3px 7px;padding:1px 2px 7px}
  .sidebar-brand-mark img{width:64px;height:48px}
}
@media(max-width:560px){.sidebar-brand-mark img{width:48px;height:36px}}
'''
              html = r'''    <div class="sidebar-brand-mark" aria-label="Lycée Watteau Valenciennes">
      <picture>
        <source media="(max-width:560px)" srcset="assets/logo-watteau-mark-48.svg">
        <source media="(max-width:820px)" srcset="assets/logo-watteau-mark-64.svg">
        <img src="assets/logo-watteau-mark-80.svg" width="80" height="60" alt="Lycée Watteau Valenciennes" decoding="async">
      </picture>
    </div>
'''
              text = text.replace('\n</style>', css + '\n</style>', 1)
              text = text.replace('  <aside class="sidebar" aria-label="Progression">\n', '  <aside class="sidebar" aria-label="Progression">\n' + html, 1)
              path.write_text(text, encoding='utf-8')
              print('V5.7 integrated')
          else:
              print('V5.7 already present')
          PY
      - name: Vérifier les assets V5.7
        if: github.event_name == 'push'
        run: |
          grep -q 'V5.7 — MARK WATTEAU SIDEBAR' index.html
          grep -q 'logo-watteau-mark-80.svg' index.html
          grep -q 'logo-watteau-mark-64.svg' index.html
          grep -q 'logo-watteau-mark-48.svg' index.html
      - name: Commit V5.7 si nécessaire
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V5.7 : intègre le mark Watteau responsive dans la sidebar'
          git push
