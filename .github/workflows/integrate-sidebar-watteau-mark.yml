name: Integrate Watteau sidebar mark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-sidebar-watteau-mark.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sidebar mark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'V5.7 — MARK WATTEAU SIDEBAR'

          if marker in text:
              print('V5.7 already present; no patch needed.')
              raise SystemExit(0)

          css = r'''

/* =========================================================
   V5.7 — MARK WATTEAU SIDEBAR
   Source institutionnelle inchangée, tailles adaptées au viewport.
   ========================================================= */
.sidebar-brand-mark{
  position:relative;
  z-index:4;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:-2px 3px 9px;
  padding:5px 4px 9px;
  border-bottom:1px solid rgba(255,212,59,.34);
}
.sidebar-brand-mark picture{display:block;line-height:0}
.sidebar-brand-mark img{
  display:block;
  width:80px;
  height:60px;
  object-fit:contain;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.28));
}
html[data-theme="light"] .sidebar-brand-mark{
  border-bottom-color:rgba(139,23,48,.18);
}
html[data-theme="light"] .sidebar-brand-mark img{
  filter:drop-shadow(0 2px 5px rgba(66,43,14,.14));
}
@media(max-width:820px){
  .sidebar-brand-mark{
    justify-content:flex-start;
    margin:0 3px 7px;
    padding:1px 2px 7px;
  }
  .sidebar-brand-mark img{width:64px;height:48px}
}
@media(max-width:560px){
  .sidebar-brand-mark img{width:48px;height:36px}
}
'''

          html = r'''    <div class="sidebar-brand-mark" aria-label="Lycée Watteau Valenciennes">
      <picture>
        <source media="(max-width:560px)" srcset="assets/logo-watteau-mark-48.svg">
        <source media="(max-width:820px)" srcset="assets/logo-watteau-mark-64.svg">
        <img src="assets/logo-watteau-mark-80.svg" width="80" height="60" alt="Lycée Watteau Valenciennes" decoding="async">
      </picture>
    </div>
'''

          style_anchor = '\n</style>'
          sidebar_anchor = '  <aside class="sidebar" aria-label="Progression">\n'

          if style_anchor not in text:
              raise SystemExit('ERROR: </style> anchor not found')
          if sidebar_anchor not in text:
              raise SystemExit('ERROR: sidebar anchor not found')

          text = text.replace(style_anchor, css + style_anchor, 1)
          text = text.replace(sidebar_anchor, sidebar_anchor + html, 1)
          path.write_text(text, encoding='utf-8')
          print('V5.7 sidebar mark integrated.')
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q 'V5.7 — MARK WATTEAU SIDEBAR' index.html
          grep -q 'logo-watteau-mark-80.svg' index.html
          grep -q 'logo-watteau-mark-64.svg' index.html
          grep -q 'logo-watteau-mark-48.svg' index.html
          test -f assets/logo-watteau-mark-80.svg
          test -f assets/logo-watteau-mark-64.svg
          test -f assets/logo-watteau-mark-48.svg

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V5.7 : intègre le mark Watteau responsive dans la sidebar'
          git push
